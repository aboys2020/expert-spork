name: Build Windows Package

# 触发方式刻意只保留两种，避免同一次提交重复出包浪费 CI 时间：
#   1. 推送版本 tag（如 v1.0.0）→ 构建 + 自动创建 Release 并附上 exe
#   2. 手动触发（Actions 页面 Run workflow）→ 只构建并上传 Artifact
# 普通 push 不会触发打包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 需要 contents: write 才能在 tag 构建时创建 Release 并上传附件
permissions:
  contents: write

# 同一分支/tag 上旧的构建自动取消，省额度
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify (Windows)
    # electron-builder --win 必须在 Windows runner 上跑；
    # Linux runner 需要额外装 Wine，稳定性差，不要换。
    #
    # 【重要】这里必须显式写 windows-2022，不要改回 windows-latest！
    # windows-latest 标签现已指向「Windows Server 2025 + Visual Studio 2026」镜像
    # （见 actions/runner-images README 的标签映射表），而 better-sqlite3 依赖的 node-gyp
    # 探测不到 VS 2026，会直接报 "Could not find any Visual Studio installation to use"。
    # windows-2022 对应 VS 2022，工具链能被 node-gyp 正确识别。
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      # 显式关闭代码签名：CI 没有证书，若让它去尝试下载/签名工具，
      # 既可能超时失败，也可能给产物打上不该有的标记。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      # 注：checkout / setup-node 用 v5，它们运行在 node24 上。
      # v4 运行在已弃用的 node20 上，会刷 "Node.js 20 is deprecated" 警告。
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # 用 npm ci 严格按 package-lock.json 安装，保证 CI 与本地一致。
        # 注意：package.json 里已不含 postinstall，这一步不会触发原生模块重编译，
        # 避免在「装依赖」阶段就因工具链问题中断，把失败点收敛到下面的专用步骤。
        #
        # 为什么要重试：npm ci 期间 electron 的 install.js 要从 GitHub 下载约 115MB 的
        # Electron 二进制，该端点会偶发 500/超时（已实际遇到过一次：
        # "HTTPError: Response code 500" 导致整步失败）。这是纯网络抖动，
        # 不是配置问题，也不该让整次构建白跑，所以自动重试。
        # 同时把「package.json 与 package-lock.json 不同步」提前拦住：
        # 否则失败信息会伪装成 "npm ci can only install packages when your package.json
        # and package-lock.json are in sync"，很容易误判成网络问题。
        shell: pwsh
        run: |
          Write-Host "--- 检查 package.json 与 package-lock.json 是否同步 ---"
          $before = (Get-FileHash package-lock.json -Algorithm SHA256).Hash
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "--- npm ci（第 $attempt / $maxAttempts 次尝试）---"
            npm ci
            if ($LASTEXITCODE -eq 0) {
              Write-Host "npm ci 成功"
              exit 0
            }
            $after = (Get-FileHash package-lock.json -Algorithm SHA256).Hash
            if ($after -ne $before) {
              Write-Error @'
          npm ci 修改了 package-lock.json，说明它与 package.json 不同步。
          请在本地执行一次 npm install 更新锁文件，并把 package-lock.json 一起提交。
          （不要用 npm ci 来修复它，那不会重新生成锁文件。）
          '@
              exit 1
            }
            Write-Warning "npm ci 第 $attempt 次失败（很可能是 Electron 二进制下载抖动）"
            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds 10
            }
          }
          Write-Error "npm ci 连续 $maxAttempts 次失败，请查看上方日志确认原因。"
          exit 1

      - name: Rebuild native modules for Electron
        # better-sqlite3 是原生模块，npm ci 拿到的是「系统 Node」的二进制，
        # 必须换成针对 Electron ABI 的版本，否则 exe 能打包成功但一运行就崩。
        #
        # 双保险策略：
        #   A. 先让 prebuild-install 下载 Electron 33 的预编译包（几秒完成，完全不需要编译器）
        #   B. 若没有预编译包，再用 electron-builder install-app-deps 走 @electron/rebuild 源码编译
        # 最后以 B 的结果为准，因为 electron-builder 打包时自身也会做一次 rebuild，两者必须一致。
        # 说明：install-app-deps 只支持 --platform / --arch（不要加 --only，会被静默忽略）。
        #
        # 关于 MSVC：这里刻意不再用 ilammy/msvc-dev-cmd 初始化 vcvars。
        # 原因：windows-2022 镜像自带 VS 2022，且实测 A 路线就能命中预编译包
        # （日志里 preparing→finished 之间没有任何编译输出即证明），因此不需要它；
        # 而该 action 只有 node20 版本，会持续产生 "Node.js 20 is deprecated" 警告。
        # 若将来改动 Electron 版本导致退回源码编译、并报 node-gyp 找不到 VS，再加回来即可：
        #   - uses: ilammy/msvc-dev-cmd@v1
        #     with: { arch: x64 }
        shell: pwsh
        run: |
          $electronVersion = (Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version
          Write-Host "Electron 版本: $electronVersion"
          Write-Host "--- A. 尝试下载 Electron 预编译包 ---"
          try {
            & npx --no-install prebuild-install --runtime electron --target $electronVersion --arch x64 --platform win32
            if ($LASTEXITCODE -eq 0) { Write-Host "预编译包已就绪（无需编译）" }
            else { Write-Host "未取到预编译包，将回退到源码编译" }
          } catch {
            Write-Host "prebuild-install 执行异常，将回退到源码编译：$($_.Exception.Message)"
          }
          Write-Host "--- B. electron-builder 重建（源码编译兜底）---"
          npm run rebuild:native

      - name: Verify tag matches package.json version
        # 防止出现 v1.2.0 的 tag 打出 1.0.0 的包这种低级事故
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:TAG_NAME.TrimStart('v')
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=$tagVersion  package.json=$pkgVersion"
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "版本号不一致：tag 是 $tagVersion，package.json 是 $pkgVersion。请先同步版本号再打 tag。"
            exit 1
          }

      - name: Build frontend & package
        # dist 脚本 = vite build && electron-builder --win --publish never
        # dist/ 被 .gitignore 忽略，所以必须先构建，electron-builder 的 files 才能取到前端资源。
        # 【重要】--publish never 不能去掉：electron-builder 只要检测到 CI 环境就会自动开启发布
        # （日志里的 reason=CI detected），没有 GH_TOKEN 就直接报错并以退出码 1 结束——即使 exe
        # 其实已经打包成功。而本项目 repository.url 指向原作者仓库 SaKongA/PopDownloader，
        # 一旦补上 token 反而可能把 Release 发到别人的仓库去。
        # 发布由下面的 softprops/action-gh-release 步骤负责，这里只管打包。
        run: npm run dist

      - name: Smoke test packaged app
        # 这一步是「原生产物真能跑」的唯一硬校验，不要删。
        # 分两阶段，目的是把问题性质区分开：
        #   阶段 1（scripts/ci-runtime-probe.js，以 ELECTRON_RUN_AS_NODE=1 执行打包后的 exe）
        #     在打包内的 Electron 运行时里加载 app.asar 的 server/index.js 并真正监听端口，
        #     不需要 GUI。若失败 ⇒ 打包内容本身有问题（ABI / asar / 依赖缺失）。
        #   阶段 2 才启动 GUI 产物，探测 /api/health 与前端入口。
        #     若阶段 1 过、阶段 2 失败 ⇒ 问题在「GUI 启动」这一环，而非打包内容。
        run: node scripts/ci-smoke-test.js

      - name: Audit asar runtime dependency closure
        # 单独一道防线：解析 app.asar 内所有运行时包的依赖能否按 Node 规则解析到。
        # 这能抓住「构建与启动都正常、只有点某个功能才崩」的坏包 ——
        # 真实案例：zip-stream 在顶层而 archiver-utils 被挤进 archiver/node_modules，
        # 导致 require('archiver') 报 Cannot find module，坏包直接发给了用户。
        run: node scripts/audit-asardeps.js

      - name: Collect deliverables
        # 只取面向用户的 exe + electron-updater 所需的 latest.yml，
        # 不把体积巨大的 win-unpacked/ 目录塞进上传列表
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          # 用 -Path 而非 Copy-Item 通配符，避免 "no files to copy" 类静默失败
          Get-ChildItem -Path release -Filter *.exe -File | Copy-Item -Destination staging -Force
          Get-ChildItem -Path release -Filter latest.yml -File | Copy-Item -Destination staging -Force
          Write-Host "--- staging ---"
          Get-ChildItem staging | Select-Object Name, @{N='Size(MB)';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          if (-not (Get-ChildItem staging -Filter *.exe -File)) {
            Write-Error "release/ 下没有生成任何 exe，请检查 package.json 的 build.win 配置。"
            exit 1
          }

      - name: Upload artifacts
        # v6 运行在 node24 上，可消除 "Node.js 20 is deprecated" 警告
        # （v4/v5 都是 node20；入参与 v5 完全一致）
        uses: actions/upload-artifact@v6
        with:
          name: PopDownloader-Windows-${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}
          path: staging/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        # 仅 tag 触发时执行，把 exe 作为 Release 附件发布
        # （exe 远超 GitHub 单文件 100MB 入库限制，所以走 Release 附件而非提交进仓库）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PopDownloader ${{ github.ref_name }}
          files: staging/*
          fail_on_unmatched_files: true
          generate_release_notes: false
